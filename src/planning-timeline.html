<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Tracker | Planning & Timeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Allura&family=Cinzel+Decorative:wght@400;700&family=Marcellus&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="planning-timeline">
  <div class="bg-shape shape-left"></div>
  <div class="bg-shape shape-right"></div>

  <header class="site-header compact">
    <p class="eyebrow">Wedding Tracker</p>
    <h1>Planning &amp; Timeline</h1>
    <p class="magic-line">A love story written in the trees.</p>
  </header>

  <main class="layout">
    <nav class="side-nav" aria-label="Hoofdnavigatie">
      <a class="nav-link" href="app.html">Dashboard</a>
      <a class="nav-link active" href="planning-timeline.html">Planning &amp; Timeline</a>
      <a class="nav-link" href="budget.html">Budget</a>
      <a class="nav-link" href="vendors.html">Leveranciers</a>
      <a class="nav-link" href="kringwinkel-koopjes.html">Kringwinkel Koopjes</a>
      <a class="nav-link" href="gasten.html">Gasten</a>
      <a class="nav-link" href="stationary.html">Stationary</a>
      <a class="nav-link" href="bedankjes.html">Bedankjes</a>
      <a class="nav-link" href="brain-dump.html">Brain Dump</a>
    </nav>

    <section class="content">
      <article class="panel reveal">
        <h2>Mijlpaal toevoegen</h2>
        <form id="timeline-form" class="form-grid">
          <label>
            Titel
            <input name="title" required placeholder="Locatie bevestigen" />
          </label>
          <label>
            Datum
            <input name="date" type="date" required />
          </label>
          <label>
            Notitie
            <input name="note" placeholder="Wie, wat, wanneer..." />
          </label>
          <button type="submit" class="btn-primary">Toevoegen</button>
        </form>
      </article>

      <article class="panel reveal">
        <h2>Planning overzicht</h2>
        <ul id="timeline-list" class="timeline-list"></ul>
      </article>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
